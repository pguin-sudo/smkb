[workspace]
resolver = "2"
members = [
    "crates/smkb-proto",
    "crates/smkb-platform",
    "crates/smkb-master",
    "crates/smkb-slave",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/pguin/smkb"

[workspace.dependencies]
smkb-proto = { path = "crates/smkb-proto" }
smkb-platform = { path = "crates/smkb-platform" }

tokio = { version = "1.53", features = ["rt", "net", "macros", "signal", "time", "sync", "io-util"] }
evdev = { version = "0.13", features = ["tokio"] }
snow = "0.10"
chacha20poly1305 = "0.11"
postcard = { version = "1.1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
mdns-sd = "0.21"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.10"
socket2 = { version = "0.6", features = ["all"] }

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"
